// SISTEM PENYIMPANAN PERMANEN BROWSER (INDEXEDDB + CLOUD SYNC)

const DB_NAME = 'SI_BOSP_SMKN4_SINJAI_DB_V1';
const STORE_NAME = 'bosp_state_store';
const STATE_KEY = 'bosp_app_saved_data';
const FIREBASE_CONFIG_KEY = 'bosp_custom_firebase_config';

const openBrowserDatabase = () => {
  return new Promise((resolve, reject) => {
    try {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
      request.onsuccess = (event) => resolve(event.target.result);
      request.onerror = (event) => reject(event.target.error);
    } catch (err) {
      reject(err);
    }
  });
};

const saveStateToBrowserDB = async (stateObj) => {
  try {
    const db = await openBrowserDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(stateObj, STATE_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify(stateObj));
      return true;
    } catch (e) {
      return false;
    }
  }
};

const loadStateFromBrowserDB = async () => {
  try {
    const db = await openBrowserDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(STATE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
};

const clearBrowserDB = async () => {
  try {
    const db = await openBrowserDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete(STATE_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    try { localStorage.removeItem(STATE_KEY); } catch (e) {}
    return false;
  }
};

const parseFirebaseConfigInput = (rawText) => {
  if (!rawText || !rawText.trim()) return null;
  const startIdx = rawText.indexOf('{');
  const endIdx = rawText.lastIndexOf('}');
  if (startIdx === -1 || endIdx === -1 || endIdx <= startIdx) return null;
  let objStr = rawText.slice(startIdx, endIdx + 1);
  objStr = objStr
    .replace(/\/\/.*$/gm, '')
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .replace(/'([^'\\]*(\\.[^'\\]*)*)'/g, '"$1"')
    .replace(/([{,]\s*)([a-zA-Z0-9_$]+)\s*:/g, '$1"$2":')
    .replace(/,\s*([}\]])/g, '$1');
  try {
    const parsed = JSON.parse(objStr);
    if (parsed && parsed.apiKey && parsed.projectId) {
      return parsed;
    }
    return null;
  } catch (e) {
    return null;
  }
};

const copyTextToClipboard = (text) => {
  try {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    textarea.style.top = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(textarea);
    return ok;
  } catch (err) {
    return false;
  }
};

const formatSyncTimestamp = (dateObj = new Date()) => {
  const d = String(dateObj.getDate()).padStart(2, '0');
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const y = dateObj.getFullYear();
  const hh = String(dateObj.getHours()).padStart(2, '0');
  const mm = String(dateObj.getMinutes()).padStart(2, '0');
  const ss = String(dateObj.getSeconds()).padStart(2, '0');
  return `${d}/${m}/${y}, ${hh}.${mm}.${ss}`;
};

const convertImageToDataURL = (file, maxWidth = 900) => {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = () => resolve(e.target.result);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
};

const formatRupiah = (angka) => {
  const num = Number(angka) || 0;
  return 'Rp ' + num.toLocaleString('id-ID');
};

const terbilangAngka = (nilai) => {
  const angka = Math.floor(Math.abs(Number(nilai) || 0));
  const huruf = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
  if (angka < 12) return huruf[angka];
  if (angka < 20) return terbilangAngka(angka - 10) + ' Belas';
  if (angka < 100) return terbilangAngka(Math.floor(angka / 10)) + ' Puluh' + (angka % 10 > 0 ? ' ' + terbilangAngka(angka % 10) : '');
  if (angka < 200) return 'Seratus' + (angka - 100 > 0 ? ' ' + terbilangAngka(angka - 100) : '');
  if (angka < 1000) return terbilangAngka(Math.floor(angka / 100)) + ' Ratus' + (angka % 100 > 0 ? ' ' + terbilangAngka(angka % 100) : '');
  if (angka < 2000) return 'Seribu' + (angka - 1000 > 0 ? ' ' + terbilangAngka(angka - 1000) : '');
  if (angka < 1000000) return terbilangAngka(Math.floor(angka / 1000)) + ' Ribu' + (angka % 1000 > 0 ? ' ' + terbilangAngka(angka % 1000) : '');
  if (angka < 1000000000) return terbilangAngka(Math.floor(angka / 1000000)) + ' Juta' + (angka % 1000000 > 0 ? ' ' + terbilangAngka(angka % 1000000) : '');
  if (angka < 1000000000000) return terbilangAngka(Math.floor(angka / 1000000000)) + ' Miliar' + (angka % 1000000000 > 0 ? ' ' + terbilangAngka(angka % 1000000000) : '');
  return '';
};

const formatTerbilangRupiah = (nilai) => {
  const num = Math.floor(Number(nilai) || 0);
  if (num === 0) return 'Nol Rupiah';
  return `${terbilangAngka(num).trim()} Rupiah`;
};

const NAMA_BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const NAMA_HARI_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

const formatTanggalIndonesia = (dateStr) => {
  if (!dateStr) return '-';
  const parts = String(dateStr).split('-');
  if (parts.length !== 3) return dateStr;
  const [y, m, d] = parts;
  const bln = NAMA_BULAN_ID[Number(m) - 1] || m;
  return `${Number(d)} ${bln} ${y}`;
};

const formatTanggalNarasi = (dateStr) => {
  if (!dateStr) return { hari: 'Senin', tanggalText: 'Satu', bulan: 'Januari', tahunText: 'Dua Ribu Dua Puluh Enam' };
  const dt = new Date(dateStr + 'T00:00:00');
  if (isNaN(dt.getTime())) return { hari: 'Senin', tanggalText: 'Satu', bulan: 'Januari', tahunText: 'Dua Ribu Dua Puluh Enam' };
  return {
    hari: NAMA_HARI_ID[dt.getDay()],
    tanggalText: terbilangAngka(dt.getDate()),
    bulan: NAMA_BULAN_ID[dt.getMonth()],
    tahunText: terbilangAngka(dt.getFullYear())
  };
};

const generateNomorDokumenSeragam = (noUrut, tahun = '2026') => {
  const cleanUrut = String(noUrut || '').trim();
  const thn = String(tahun || '2026').trim();
  const urutPart = cleanUrut || '___';
  return {
    noUrut: cleanUrut,
    noKwitansi: `900/${urutPart}/SMKN4-SJ/KWT/BOSP/${thn}`,
    noNotaPesanan: `900/${urutPart}/SMKN4-SJ/NP/BOSP/${thn}`,
    noBAPenerimaan: `900/${urutPart}/SMKN4-SJ/BAP/BOSP/${thn}`,
    noBAST: `900/${urutPart}/SMKN4-SJ/BAST/BOSP/${thn}`,
    noBAPemeriksaan: `900/${urutPart}/SMKN4-SJ/DSB/BOSP/${thn}`,
    noFaktur: ''
  };
};

const normalizeTransactionNumbers = (trx) => {
  if (!trx) return trx;
  const thn = trx.tahunAnggaran || '2026';
  let noUrut = trx.noUrut;
  if (noUrut === undefined || noUrut === null) {
    const match = String(trx.noKwitansi || trx.id || '').match(/900\/([^/]+)\//);
    noUrut = match ? match[1] : '001';
  }
  const nomor = generateNomorDokumenSeragam(noUrut, thn);
  return {
    ...trx,
    ...nomor,
    id: trx.id || nomor.noKwitansi
  };
};

const susunRedaksiKwitansiOtomatis = (trx, schoolData) => {
  const itemText = (trx.itemBelanjaRingkas || trx.uraianBelanja || 'Belanja Barang').trim();
  const kegSpesifik = (trx.kegiatanSpesifik || '').trim();
  const kegArkas = (trx.namaKegiatan || '').trim();
  const bankTujuan = (trx.bankPemindahbukuan || '').trim();
  const np = trx.noNotaPesanan || '';
  const tglPesan = trx.tanggalPesan ? formatTanggalIndonesia(trx.tanggalPesan) : '';
  const sekolah = schoolData?.namaSekolah || 'UPT SMK Negeri 4 Sinjai';

  let kalimat = `Pembayaran Belanja ${itemText}`;
  if (kegSpesifik) kalimat += ` untuk Kegiatan ${kegSpesifik}`;
  if (kegArkas) kalimat += ` (${kegArkas})`;
  kalimat += ` pada ${sekolah}`;
  if (np) kalimat += ` sesuai Nota Pesanan Nomor: ${np}`;
  if (tglPesan) kalimat += ` tanggal ${tglPesan}`;
  if (bankTujuan) kalimat += ` melalui Pemindahbukuan ke ${bankTujuan}`;
  kalimat += '.';
  return kalimat;
};

      saldoBerjalan -= realisasi;

                  ...editingTrx,
                  namaPenyedia: newTokoForm.namaPenyedia,
                  namaPemilikPenyedia: newTokoForm.namaPemilikPenyedia,
                  alamatPenyedia: newTokoForm.alamatPenyedia,
                  teleponPenyedia: newTokoForm.teleponPenyedia,
                  npwpPenyedia: newTokoForm.npwpPenyedia || ''
                });
                setShowModalTambahToko(false);
                setNewTokoForm({ namaPenyedia: '', alamatPenyedia: '', namaPemilikPenyedia: '', teleponPenyedia: '', npwpPenyedia: '' });
                showToast(`Toko "${newTokoForm.namaPenyedia}" berhasil ditambahkan & tersimpan di daftar toko!`);
              }}
              className="space-y-3"
            >
              <div>
                <label className="font-bold block mb-1">Nama Toko / Perusahaan</label>
                <input
                  required
                  value={newTokoForm.namaPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, namaPenyedia: e.target.value })}
                  placeholder="Contoh: TOKO BERKAH JAYA"
                  className="w-full border border-slate-300 rounded-lg p-2 font-bold"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">Alamat Toko</label>
                <input
                  value={newTokoForm.alamatPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, alamatPenyedia: e.target.value })}
                  placeholder="Contoh: Jl. Poros Sinjai..."
                  className="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">Nama Pemilik / Penanda Tangan</label>
                <input
                  value={newTokoForm.namaPemilikPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, namaPemilikPenyedia: e.target.value })}
                  placeholder="Contoh: Budi Santoso"
                  className="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">Nomor HP / Kontak</label>
                <input
                  value={newTokoForm.teleponPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, teleponPenyedia: e.target.value })}
                  placeholder="Contoh: 081234567890"
                  className="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">NPWP Toko / Penyedia</label>
                <input
                  value={newTokoForm.npwpPenyedia || ''}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, npwpPenyedia: e.target.value })}
                  placeholder="Contoh: 730705839162047"
                  className="w-full border border-slate-300 rounded-lg p-2 font-mono"
                />
              </div>

              <div className="pt-2 flex justify-end gap-2">
                <button
                  type="button"
                  onClick={() => setShowModalTambahToko(false)}
                  className="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 font-bold text-slate-700"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 font-bold text-white shadow-sm"
                >
                  Simpan & Pilih Toko
                </button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const rootElement = document.getElementById('root');
const root = createRoot(rootElement);
root.render(<App />);
    </script>
</body>
</html>
