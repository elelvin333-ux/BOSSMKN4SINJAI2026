// ==========================================
// KONFIGURASI FIREBASE UNTUK HOSTING ONLINE DI GITHUB PAGES
// Ganti bagian GITHUB_FIREBASE_CONFIG di bawah ini dengan kode dari tombol
// "Salin Kode untuk index.html (GitHub)" di menu Backup & Restore.

const GITHUB_APP_ID = 'bosp-smkn4-sinjai';

const openBrowserDatabase = () => {
  return new Promise((resolve, reject) => {
    if (typeof window === 'undefined' || !window.indexedDB) {
      reject(new Error('IndexedDB tidak didukung'));
      return;
    }
    const request = window.indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
};

const saveStateToBrowserDB = async (data) => {
  try {
    const db = await openBrowserDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.put(data, STATE_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.warn('Gagal menyimpan ke DB Browser:', err);
    return false;
  }
};

const loadStateFromBrowserDB = async () => {
  try {
    const db = await openBrowserDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(STATE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    console.warn('Gagal memuat dari DB Browser:', err);
    return null;
  }
};

const clearBrowserDB = async () => {

      const tx = db.transaction(STORE_NAME, 'readwrite');

// Parser fleksibel untuk input JSON atau objek JS firebaseConfig langsung dari Firebase Console
const parseFirebaseConfigInput = (rawText) => {
  if (!rawText || !rawText.trim()) return null;
  const trimmed = rawText.trim();
  const startIdx = trimmed.indexOf('{');
  const endIdx = trimmed.lastIndexOf('}');
  if (startIdx === -1 || endIdx === -1 || endIdx <= startIdx) return null;
  let objStr = trimmed.slice(startIdx, endIdx + 1);
  try {
    const parsed = JSON.parse(objStr);
    if (parsed && parsed.apiKey && parsed.projectId) return parsed;
  } catch (e) {
    // Jika format objek JS (tanpa tanda kutip pada key), ubah ke JSON valid
    try {
      const jsonNormalized = objStr
        .replace(/\/\/.*$/gm, '')
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .replace(/(['"])?([a-zA-Z0-9_]+)(['"])?\s*:/g, '"$2":')
        .replace(/'([^']*)'/g, '"$1"')
        .replace(/,\s*}/g, '}');
      const parsed = JSON.parse(jsonNormalized);
      if (parsed && parsed.apiKey && parsed.projectId) return parsed;
    } catch (e2) {
      return null;
    }
  }
  return null;
};

// Helper salin teks ke clipboard yang kompatibel dengan iframe
const copyTextToClipboard = (text) => {
  try {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.top = '-9999px';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(textarea);
    return ok;
  } catch (err) {
    return false;
  }
};

// Helper Konversi File Gambar ke DataURL terkompresi agar gambar bertahan saat direfresh
const convertImageToDataURL = (file, maxWidth = 900) => {
  return new Promise((resolve) => {
    if (!file) {
      resolve(null);
      return;
    }
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = () => resolve(event.target.result);
      img.src = event.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
};

const formatRupiah = (angka) => {
  if (angka === null || angka === undefined || isNaN(angka)) return 'Rp 0';
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    minimumFractionDigits: 0,
    maximumFractionDigits: 0,
  }).format(angka);
};

const angkaKeTerbilang = (nilai) => {
  nilai = Math.abs(Math.floor(nilai));
  const huruf = [
    '', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'
  ];
  let temp = '';
  if (nilai < 12) {
    temp = ' ' + huruf[nilai];
  } else if (nilai < 20) {
    temp = angkaKeTerbilang(nilai - 10) + ' Belas';
  } else if (nilai < 100) {
    temp = angkaKeTerbilang(Math.floor(nilai / 10)) + ' Puluh' + angkaKeTerbilang(nilai % 10);
  } else if (nilai < 200) {
    temp = ' Seratus' + angkaKeTerbilang(nilai - 100);
  } else if (nilai < 1000) {
    temp = angkaKeTerbilang(Math.floor(nilai / 100)) + ' Ratus' + angkaKeTerbilang(nilai % 100);
  } else if (nilai < 2000) {
    temp = ' Seribu' + angkaKeTerbilang(nilai - 1000);
  } else if (nilai < 1000000) {
    temp = angkaKeTerbilang(Math.floor(nilai / 1000)) + ' Ribu' + angkaKeTerbilang(nilai % 1000);
  } else if (nilai < 1000000000) {
    temp = angkaKeTerbilang(Math.floor(nilai / 1000000)) + ' Juta' + angkaKeTerbilang(nilai % 1000000);
  } else if (nilai < 1000000000000) {
    temp = angkaKeTerbilang(Math.floor(nilai / 1000000000)) + ' Miliar' + angkaKeTerbilang(nilai % 1000000000);
  }
  return temp.trim();
};

const formatTerbilang = (nilai) => {
  if (!nilai || nilai <= 0) return 'Nol Rupiah';
  return `${angkaKeTerbilang(nilai)} Rupiah`;
};

const getInfoTanggalIndonesia = (dateStr) => {
  if (!dateStr) return { hari: '-', tanggal: '-', bulan: '-', tahun: '-', lengkap: '-', kalimat: '-' };
  const date = new Date(dateStr);
  const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const namaBulan = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];
  const hari = namaHari[date.getDay()];
  const tgl = date.getDate();
  const bulan = namaBulan[date.getMonth()];
  const tahun = date.getFullYear();

  return {
    hari,
    tanggal: tgl,
    bulan,
    tahun,
    lengkap: `${tgl} ${bulan} ${tahun}`,
    kalimat: `Pada hari ini ${hari} tanggal ${ angkaKeTerbilang(tgl) } bulan ${bulan} tahun ${ angkaKeTerbilang(tahun) } (${tgl}-${String(date.getMonth() + 1).padStart(2, '0')}-${tahun})`
  };
};

    noKwitansi: `900/${cleanNo}/ SMKN4-SJ/KWT/BOSP/${thn}`,
    noNotaPesanan: `900/${cleanNo}/SMKN4-SJ/NP/BOSP/${thn}`,

  if (trx.noKwitansi) {
    const parts = trx.noKwitansi.split('/');
    if (parts.length >= 2 && parts[0].trim() === '900' && parts[1].trim() !== '') {
      return parts[1].trim();
    }
  }
  if (trx.noUrut) return trx.noUrut.toString().trim();
  return '001';
};

// Normalisasi transaksi agar hanya menampilkan format nomor yang ditentukan

  const urut = extractNomorUrut(trx);

          setSelectedTrxId(lastSelected);

        if (savedData.tokoList && savedData.tokoList.length > 0) {

          savedData.tokoList.forEach((st) => {

      transactions: overrides.transactions || transactions,

      const realisasi = (t.items || []).reduce((s, i) => s + ((Number(i.jumlah) || 0) * (Number(i.harga) || 0)), 0) - (Number(t.diskon) || 0) + (Number(t.pajakPPN) || 0);
      saldoBerjalan -= realisasi;
      return [
        idx + 1,
        getInfoTanggalIndonesia(t.tanggalKwitansi || t.tanggal).lengkap,
        t.noKwitansi || t.id,
        t.uraianBelanja || t.namaKegiatan || '-',
        realisasi,
        saldoBerjalan
      ].map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',');
    });
    const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Rekap_BOSP_SMKN4_Sinjai_${schoolData.tahunAnggaran}.csv`;
    document.body.appendChild(link);

      const q = searchQuery.trim().toLowerCase();

        !q ||
        (t.id || '').toLowerCase().includes(q) ||
        (t.uraianBelanja || '').toLowerCase().includes(q) ||
        (t.namaPenyedia || '').toLowerCase().includes(q) ||
        (t.namaKegiatan || '').toLowerCase().includes(q);
      const matchBulan = filterBulan === 'Semua' || t.bulan === filterBulan;
      const matchKomponen = filterKomponen === 'Semua' || t.komponen === filterKomponen;
      return matchQuery && matchBulan && matchKomponen;

      return da - db;

      const subtotal = (trx.items || []).reduce(
        (s, i) => s + ((Number(i.jumlah) || 0) * (Number(i.harga) || 0)),
        0
      );
      const jumlahRealisasi = subtotal - (Number(trx.diskon) || 0) + (Number(trx.pajakPPN) || 0);

                          a.href = url;

                            ...editingTrx,
                            itemBelanjaRingkas: val,
                            uraianBelanja: `Belanja ${val}${editingTrx.kegiatanSpesifik ? ` untuk Kegiatan ${editingTrx.kegiatanSpesifik}` : ''}`
                          };
                          if (!editingTrx.isRedaksiManualEdited) {
                            nextTrx.redaksiKwitansiManual = susunRedaksiKwitansiOtomatis(nextTrx, schoolData);
                          }
                          setEditingTrx(nextTrx);
                        }}
                        placeholder="Contoh: Nasi Kotak / ATK..."
                        className="w-full border border-slate-300 rounded-lg p-2 bg-white font-semibold"
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-700">2. Untuk Kegiatan ... (Misal: Seleksi Paski)</label>
                      <input
                        value={editingTrx.kegiatanSpesifik || ''}
                        onChange={(e) => {
                          const val = e.target.value;
                          const itemVal = editingTrx.itemBelanjaRingkas ?? editingTrx.uraianBelanja ?? '';
                          const nextTrx = {
                            ...editingTrx,
                            kegiatanSpesifik: val,
                            uraianBelanja: `Belanja ${itemVal}${val ? ` untuk Kegiatan ${val}` : ''}`
                          };
                          if (!editingTrx.isRedaksiManualEdited) {
                            nextTrx.redaksiKwitansiManual = susunRedaksiKwitansiOtomatis(nextTrx, schoolData);
                          }
                          setEditingTrx(nextTrx);
                        }}
                        placeholder="Contoh: Seleksi Paski..."
                        className="w-full border border-slate-300 rounded-lg p-2 bg-white font-semibold"
                      />
                    </div>
                    <div>
                      <label className="font-bold block mb-1 text-slate-700">3. Pemindahbukuan ke Bank ... (Manual)</label>
                      <input
                        value={editingTrx.bankPemindahbukuan || ''}
                        onChange={(e) => {
                          const nextTrx = { ...editingTrx, bankPemindahbukuan: e.target.value };
                          if (!editingTrx.isRedaksiManualEdited) {
                            nextTrx.redaksiKwitansiManual = susunRedaksiKwitansiOtomatis(nextTrx, schoolData);
                          }
                          setEditingTrx(nextTrx);
                        }}
                        placeholder="Contoh: Bank Sulselbar / BRI..."
                        className="w-full border border-slate-300 rounded-lg p-2 bg-white font-semibold"
                      />
                    </div>
                  </div>

                  <div className="pt-2 border-t border-orange-200 space-y-1.5">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <label className="font-bold text-slate-800">
                        Preview & Edit Bebas Redaksi "Untuk Pembayaran" Kwitansi:
                      </label>
                      <button
                        type="button"
                        onClick={() => {
                          setEditingTrx({
                            ...editingTrx,
                            redaksiKwitansiManual: susunRedaksiKwitansiOtomatis(editingTrx, schoolData),
                            isRedaksiManualEdited: false
                          });
                        }}
                        className="text-[11px] font-bold bg-orange-100 hover:bg-orange-200 text-orange-900 px-2.5 py-1 rounded-md flex items-center gap-1 transition"
                        title="Susun ulang otomatis dari 3 kotak isian di atas"
                      >
                        <RefreshCw className="w-3 h-3" /> Susun Ulang Otomatis
                      </button>
                    </div>
                    <textarea
                      rows={3}
                      value={editingTrx.redaksiKwitansiManual ?? susunRedaksiKwitansiOtomatis(editingTrx, schoolData)}
                      onChange={(e) => {
                        setEditingTrx({
                          ...editingTrx,
                          redaksiKwitansiManual: e.target.value,
                          isRedaksiManualEdited: true
                        });
                      }}
                      placeholder="Ketik atau edit seluruh kalimat Untuk Pembayaran pada Kwitansi secara bebas di sini..."
                      className="w-full border border-slate-300 focus:border-orange-500 rounded-lg p-2.5 text-xs font-medium text-slate-900 leading-relaxed bg-orange-50/30 focus:bg-white"
                    />
                    <span className="text-[10px] text-slate-500 block">
                      * Anda dapat menghapus bagian mana pun atau mengetik ulang seluruh kalimat di kotak ini. Kalimat di dalam kotak inilah yang akan tercetak pada Kwitansi.
                    </span>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-orange-50/50 p-4 rounded-xl border border-orange-200/80">
                <div className="md:col-span-3 flex flex-wrap items-center justify-between gap-2">
                  <label className="font-bold">Pilih Toko / Rekanan Langganan (Terisi Otomatis)</label>
                  <div className="flex items-center gap-2">
                    <select
                      onChange={(e) => {
                        const namaSelected = e.target.value;
                        if (!namaSelected) return;
                        const found = tokoList.find(tk => tk.namaPenyedia === namaSelected);
                        if (found) {
                          setEditingTrx({
                            ...editingTrx,
                            namaPenyedia: found.namaPenyedia,
                            namaPemilikPenyedia: found.namaPemilikPenyedia,
                            alamatPenyedia: found.alamatPenyedia,
                            teleponPenyedia: found.teleponPenyedia || '',
                            npwpPenyedia: found.npwpPenyedia || ''
                          });
                        }
                      }}
                      className="border border-orange-400 bg-orange-50 text-orange-950 font-bold rounded-lg px-3 py-1.5 text-xs"
                    >
                      <option value="">-- Pilih dari Daftar Toko Sekolah --</option>
                      {tokoList.map((tk, idx) => (
                        <option key={idx} value={tk.namaPenyedia}>{tk.namaPenyedia} {tk.npwpPenyedia ? `(NPWP: ${tk.npwpPenyedia})` : ''}</option>
                      ))}
                    </select>
                    <button
                      type="button"
                      onClick={() => setShowModalTambahToko(true)}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1 shadow-sm transition"
                    >
                      <Plus className="w-3.5 h-3.5" /> Tambah Toko / Rekanan Baru
                    </button>
                  </div>
                </div>

                <div>
                  <label className="font-bold block mb-1">Nama Toko / CV / PT Penyedia</label>
                  <input required value={editingTrx.namaPenyedia} onChange={(e) => setEditingTrx({ ...editingTrx, namaPenyedia: e.target.value })} placeholder="Contoh: TOKO AHYAR" className="w-full border border-slate-300 rounded-lg p-2 bg-white font-bold" />
                </div>
                <div>
                  <label className="font-bold block mb-1">Nama Penanda Tangan / Pemilik Toko</label>
                  <input required value={editingTrx.namaPemilikPenyedia} onChange={(e) => setEditingTrx({ ...editingTrx, namaPemilikPenyedia: e.target.value })} placeholder="Nama Penanda Tangan" className="w-full border border-slate-300 rounded-lg p-2 bg-white" />
                </div>
                <div>
                  <label className="font-bold block mb-1">Alamat Penyedia</label>
                  <input value={editingTrx.alamatPenyedia} onChange={(e) => setEditingTrx({ ...editingTrx, alamatPenyedia: e.target.value })} className="w-full border border-slate-300 rounded-lg p-2 bg-white" />
                </div>
                <div>
                  <label className="font-bold block mb-1">NPWP Penyedia / Toko</label>
                  <input value={editingTrx.npwpPenyedia || ''} onChange={(e) => setEditingTrx({ ...editingTrx, npwpPenyedia: e.target.value })} placeholder="Contoh: 02.456.789.1-805.000 (Opsional)" className="w-full border border-slate-300 rounded-lg p-2 bg-white font-mono" />
                </div>
                <div>
                  <label className="font-bold block mb-1">Nomor HP / Telepon Penyedia</label>
                  <input value={editingTrx.teleponPenyedia || ''} onChange={(e) => setEditingTrx({ ...editingTrx, teleponPenyedia: e.target.value })} placeholder="Contoh: 0812-xxxx-xxxx" className="w-full border border-slate-300 rounded-lg p-2 bg-white" />
                </div>

                <div className="md:col-span-3 border-t border-slate-200 pt-3 mt-1">
                  <p className="font-extrabold text-slate-800 mb-2">Penanggung Jawab Kegiatan (Pihak Kedua / Penerima pada BA Pendistribusian Barang):</p>
                </div>
                <div>
                  <label className="font-bold block mb-1">Pilih Penanggung Jawab Kegiatan</label>
                  <select
                    value={editingTrx.namaPJKegiatan || ''}
                    onChange={(e) => {
                      const selectedName = e.target.value;
                      const foundPegawai = DAFTAR_PEGAWAI_PJ.find(p => p.nama === selectedName);
                      setEditingTrx({
                        ...editingTrx,
                        namaPJKegiatan: selectedName,
                        nipPJKegiatan: foundPegawai ? foundPegawai.nip : ''
                      });
                    }}
                    className="w-full border border-slate-300 rounded-lg p-2 bg-white font-bold text-sky-900"
                  >
                    <option value="">-- Pilih Nama Pegawai / PJ Kegiatan --</option>
                    {DAFTAR_PEGAWAI_PJ.map((peg, idx) => (
                      <option key={idx} value={peg.nama}>{peg.nama} {peg.nip ? `(${peg.nip})` : ''}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="font-bold block mb-1">Pangkat / Golongan PJ Kegiatan</label>
                  <input value={editingTrx.pangkatPJKegiatan || ''} onChange={(e) => setEditingTrx({ ...editingTrx, pangkatPJKegiatan: e.target.value })} placeholder="Contoh: III/c" className="w-full border border-slate-300 rounded-lg p-2 bg-white" />
                </div>
                <div>
                  <label className="font-bold block mb-1">NIP PJ Kegiatan (Terisi Otomatis)</label>
                  <input value={editingTrx.nipPJKegiatan || ''} onChange={(e) => setEditingTrx({ ...editingTrx, nipPJKegiatan: e.target.value })} placeholder="Nomor NIP..." className="w-full border border-slate-300 rounded-lg p-2 bg-white font-mono" />
                </div>

                <div className="md:col-span-3 border-t border-slate-200 pt-3 mt-1">
                  <p className="font-extrabold text-slate-800 mb-2">Preview Otomatis Format Nomor Masing-Masing Dokumen (Default Bagian Belakang):</p>
                </div>
                <div>
                  <label className="font-bold block mb-1 text-sky-800">1. Nomor Kwitansi (KWT)</label>
                  <input readOnly value={editingTrx.noKwitansi} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-indigo-800">2. Nomor Nota Pesanan (NP)</label>
                  <input readOnly value={editingTrx.noNotaPesanan} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-amber-800">3. Nomor BA Pemeriksaan (BAP)</label>
                  <input readOnly value={editingTrx.noBAPenerimaan} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-emerald-800">4. Nomor BA Serah Terima Barang (BAST)</label>
                  <input readOnly value={editingTrx.noBAST} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-purple-800">5. Nomor BA Pendistribusian (DSB)</label>
                  <input readOnly value={editingTrx.noBAPemeriksaan} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-slate-500">6. Nomor Faktur (Dikosongkan)</label>
                  <input readOnly value={editingTrx.noFaktur} placeholder="(Kosong sesuai ketentuan)" className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] italic text-slate-500" />
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="font-extrabold text-sm text-slate-800">Daftar Rincian Barang / Jasa</label>
                  <button
                    type="button"
                    onClick={() => setEditingTrx({
                      ...editingTrx,
                      items: [...editingTrx.items, { id: Date.now(), nama: '', jumlah: 1, satuan: 'Unit', harga: 0, kondisi: 'Baik & Baru', hasilPeriksa: 'Sesuai' }]
                    })}
                    className="bg-orange-950 hover:bg-orange-900 text-white px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 transition"
                  >
                    <Plus className="w-3.5 h-3.5 text-orange-400" /> Tambah Baris Barang
                  </button>
                </div>

                <table className="w-full border-collapse border border-slate-300 text-xs">
                  <thead className="bg-orange-50">
                    <tr>
                      <th className="border p-2">Nama Barang</th>
                      <th className="border p-2 w-16">Qty</th>
                      <th className="border p-2 w-20">Satuan</th>
                      <th className="border p-2 w-28">Harga Satuan</th>
                      <th className="border p-2 w-28">Checklist BAP</th>
                      <th className="border p-2 w-28 text-right">Subtotal</th>
                      <th className="border p-2 w-10"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {editingTrx.items.map((item, idx) => (
                      <tr key={item.id}>
                        <td className="border p-1.5">
                          <input required value={item.nama} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].nama = e.target.value;
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} placeholder="Nama barang..." className="w-full p-1 border rounded" />
                        </td>
                        <td className="border p-1.5">
                          <input type="number" min="1" value={item.jumlah} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].jumlah = Number(e.target.value);
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} className="w-full p-1 border rounded text-center" />
                        </td>
                        <td className="border p-1.5">
                          <input value={item.satuan} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].satuan = e.target.value;
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} className="w-full p-1 border rounded text-center" />
                        </td>
                        <td className="border p-1.5">
                          <input type="number" min="0" value={item.harga} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].harga = Number(e.target.value);
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} className="w-full p-1 border rounded text-right" />
                        </td>
                        <td className="border p-1.5">
                          <select value={item.hasilPeriksa} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].hasilPeriksa = e.target.value;
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} className="w-full p-1 border rounded">
                            <option>Sesuai</option>
                            <option>Tidak Sesuai</option>
                            <option>Perlu Perbaikan</option>
                          </select>
                        </td>
                        <td className="border p-1.5 text-right font-bold">
                          {formatRupiah(item.jumlah * item.harga)}
                        </td>
                        <td className="border p-1.5 text-center">
                          {editingTrx.items.length > 1 && (
                            <button type="button" onClick={() => setEditingTrx({ ...editingTrx, items: editingTrx.items.filter((_, i) => i !== idx) })} className="text-red-600">
                              <Trash2 className="w-4 h-4" />
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="flex items-center justify-between pt-4 border-t border-orange-200">
                <div>
                  <span className="text-slate-500">Total Pembayaran Otomatis: </span>
                  <span className="text-lg font-extrabold text-emerald-700">
                    {formatRupiah(editingTrx.items.reduce((s, i) => s + (i.jumlah * i.harga), 0))}
                  </span>
                </div>
                <div className="flex gap-3">
                  <button type="button" onClick={() => setShowTrxModal(false)} className="px-4 py-2.5 rounded-xl border border-slate-300 font-bold">
                    Batal
                  </button>
                  <button type="submit" className="bg-orange-600 hover:bg-orange-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-md transition">
                    Simpan Transaksi & Generate Seluruh Dokumen SPJ
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ========================================== */}
      {/* MODAL POPUP TAMBAH TOKO / REKANAN BARU */}
      {/* ========================================== */}
      {showModalTambahToko && (
        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 print:hidden">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 text-xs space-y-4">
            <div className="flex items-center justify-between border-b pb-3">
              <h3 className="font-extrabold text-sm text-slate-900 flex items-center gap-2">
                <Building2 className="w-5 h-5 text-emerald-600" />
                <span>Tambah Toko / Rekanan Baru</span>
              </h3>
              <button onClick={() => setShowModalTambahToko(false)} className="p-1 rounded-lg hover:bg-slate-100">
                <X className="w-4 h-4" />
              </button>
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                if (!newTokoForm.namaPenyedia) {
                  showToast('Nama Toko wajib diisi!', 'error');
                  return;
                }
                setTokoList(prev => [...prev, newTokoForm]);
                setEditingTrx({
                  ...editingTrx,
                  namaPenyedia: newTokoForm.namaPenyedia,
                  namaPemilikPenyedia: newTokoForm.namaPemilikPenyedia,
                  alamatPenyedia: newTokoForm.alamatPenyedia,
                  teleponPenyedia: newTokoForm.teleponPenyedia,
                  npwpPenyedia: newTokoForm.npwpPenyedia || ''
                });
                setShowModalTambahToko(false);
                setNewTokoForm({ namaPenyedia: '', alamatPenyedia: '', namaPemilikPenyedia: '', teleponPenyedia: '', npwpPenyedia: '' });
                showToast(`Toko "${newTokoForm.namaPenyedia}" berhasil ditambahkan & tersimpan di daftar toko!`);
              }}
              className="space-y-3"
            >
              <div>
                <label className="font-bold block mb-1">Nama Toko / Perusahaan</label>
                <input
                  required
                  value={newTokoForm.namaPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, namaPenyedia: e.target.value })}
                  placeholder="Contoh: TOKO BERKAH JAYA"
                  className="w-full border border-slate-300 rounded-lg p-2 font-bold"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">Alamat Toko</label>
                <input
                  value={newTokoForm.alamatPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, alamatPenyedia: e.target.value })}
                  placeholder="Contoh: Jl. Poros Sinjai..."
                  className="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">Nama Pemilik / Penanda Tangan</label>
                <input
                  value={newTokoForm.namaPemilikPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, namaPemilikPenyedia: e.target.value })}
                  placeholder="Contoh: Budi Santoso"
                  className="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">Nomor HP / Kontak</label>
                <input
                  value={newTokoForm.teleponPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, teleponPenyedia: e.target.value })}
                  placeholder="Contoh: 081234567890"
                  className="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">NPWP Toko / Penyedia</label>
                <input
                  value={newTokoForm.npwpPenyedia || ''}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, npwpPenyedia: e.target.value })}
                  placeholder="Contoh: 730705839162047"
                  className="w-full border border-slate-300 rounded-lg p-2 font-mono"
                />
              </div>

              <div className="pt-2 flex justify-end gap-2">
                <button
                  type="button"
                  onClick={() => setShowModalTambahToko(false)}
                  className="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 font-bold text-slate-700"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 font-bold text-white shadow-sm"
                >
                  Simpan & Pilih Toko
                </button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const rootElement = document.getElementById('root');
const root = createRoot(rootElement);
root.render(<App />);

    </script>
</body>
</html>
