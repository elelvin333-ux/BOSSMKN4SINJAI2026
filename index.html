// ==========================================
// SISTEM PENYIMPANAN PERMANEN BROWSER (INDEXEDDB + CLOUD SYNC)
// Memastikan data tetap tersimpan walaupun aplikasi di-refresh atau ditutup
// ==========================================
const DB_NAME = 'SI_BOSP_SMKN4_SINJAI_DB_V1';
const STORE_NAME = 'bosp_state_store';
const STATE_KEY = 'bosp_app_saved_data';

const openBrowserDatabase = () => {
  return new Promise((resolve, reject) => {
    if (typeof window === 'undefined' || !window.indexedDB) {
      reject(new Error('IndexedDB tidak didukung'));
      return;
    }
    const request = window.indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
};

const saveStateToBrowserDB = async (data) => {
  try {
    const db = await openBrowserDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.put(data, STATE_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.warn('Gagal menyimpan ke DB Browser:', err);
    return false;
  }
};

const loadStateFromBrowserDB = async () => {
  try {
    const db = await openBrowserDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get(STATE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    console.warn('Gagal memuat dari DB Browser:', err);
    return null;
  }
};

const clearBrowserDB = async () => {
  try {
    const db = await openBrowserDatabase();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      store.delete(STATE_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    return false;
  }
};

// Helper Konversi File Gambar ke DataURL terkompresi agar gambar bertahan saat direfresh
const convertImageToDataURL = (file, maxWidth = 900) => {
  return new Promise((resolve) => {
    if (!file) {
      resolve(null);
      return;
    }
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = () => resolve(event.target.result);
      img.src = event.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
};

const formatRupiah = (angka) => {
  if (angka === null || angka === undefined || isNaN(angka)) return 'Rp 0';
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    minimumFractionDigits: 0,
    maximumFractionDigits: 0,
  }).format(angka);
};

const angkaKeTerbilang = (nilai) => {
  nilai = Math.abs(Math.floor(nilai));
  const huruf = [
    '', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'
  ];
  let temp = '';
  if (nilai < 12) {
    temp = ' ' + huruf[nilai];
  } else if (nilai < 20) {
    temp = angkaKeTerbilang(nilai - 10) + ' Belas';
  } else if (nilai < 100) {
    temp = angkaKeTerbilang(Math.floor(nilai / 10)) + ' Puluh' + angkaKeTerbilang(nilai % 10);
  } else if (nilai < 200) {
    temp = ' Seratus' + angkaKeTerbilang(nilai - 100);
  } else if (nilai < 1000) {
    temp = angkaKeTerbilang(Math.floor(nilai / 100)) + ' Ratus' + angkaKeTerbilang(nilai % 100);
  } else if (nilai < 2000) {
    temp = ' Seribu' + angkaKeTerbilang(nilai - 1000);
  } else if (nilai < 1000000) {
    temp = angkaKeTerbilang(Math.floor(nilai / 1000)) + ' Ribu' + angkaKeTerbilang(nilai % 1000);
  } else if (nilai < 1000000000) {
    temp = angkaKeTerbilang(Math.floor(nilai / 1000000)) + ' Juta' + angkaKeTerbilang(nilai % 1000000);
  } else if (nilai < 1000000000000) {
    temp = angkaKeTerbilang(Math.floor(nilai / 1000000000)) + ' Miliar' + angkaKeTerbilang(nilai % 1000000000);
  }
  return temp.trim();
};

const formatTerbilang = (nilai) => {
  if (!nilai || nilai <= 0) return 'Nol Rupiah';
  return `${angkaKeTerbilang(nilai)} Rupiah`;
};

const getInfoTanggalIndonesia = (dateStr) => {
  if (!dateStr) return { hari: '-', tanggal: '-', bulan: '-', tahun: '-', lengkap: '-', kalimat: '-' };
  const date = new Date(dateStr);
  const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const namaBulan = [
    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
  ];
  const hari = namaHari[date.getDay()];
  const tgl = date.getDate();
  const bulan = namaBulan[date.getMonth()];
  const tahun = date.getFullYear();

  return {
    hari,
    tanggal: tgl,
    bulan,
    tahun,
    lengkap: `${tgl} ${bulan} ${tahun}`,
    kalimat: `Pada hari ini ${hari} tanggal ${ angkaKeTerbilang(tgl) } bulan ${bulan} tahun ${ angkaKeTerbilang(tahun) } (${tgl}-${String(date.getMonth() + 1).padStart(2, '0')}-${tahun})`
  };
};

  const cleanNo = (noUrut || '001').toString().trim();
  const thn = (tahun || '2026').toString().trim();
  return {
    noUrut: cleanNo,
    noKwitansi: `900/${cleanNo}/ SMKN4-SJ/KWT/BOSP/${thn}`,
    noNotaPesanan: `900/${cleanNo}/SMKN4-SJ/NP/BOSP/${thn}`,
    noFaktur: '',
    noBAPenerimaan: `900/${cleanNo}/SMKN4-SJ/BAP/BOSP/${thn}`,
    noBAPemeriksaan: `900/${cleanNo}/SMKN4-SJ/DSB/BOSP/${thn}`,
    noBAST: `900/${cleanNo}/SMKN4-SJ/BAST/BOSP/${thn}`,
  };
};

// Ekstrak nomor urut dari format nomor lama atau baru
const extractNomorUrut = (trx) => {
  if (trx.noKwitansi) {
    const parts = trx.noKwitansi.split('/');
    if (parts.length >= 2 && parts[0].trim() === '900' && parts[1].trim() !== '') {
      return parts[1].trim();
    }
  }
  if (trx.noUrut) return trx.noUrut.toString().trim();
  return '001';
};

// Normalisasi transaksi agar hanya menampilkan format nomor yang ditentukan
const normalizeTransactionNumbers = (trx) => {
  const urut = extractNomorUrut(trx);
  const thn = trx.tahunAnggaran || '2026';
  const generated = generateNomorDokumenSeragam(urut, thn);
  return {
    ...trx,
    ...generated
  };
};

      <div className="grid grid-cols-2 gap-8 text-center mt-6 items-end text-xs">
        <div className="flex flex-col justify-end min-h-[140px]">

        </div>
        <div className="flex flex-col justify-end min-h-[140px]">
          <p>{schoolData.kabupatenKota}, {tglTrx.lengkap}</p>
          <p className="font-bold">Bendahara Dana BOSP</p>
          <div className="h-16"></div>
          <p className="font-bold underline">{schoolData.bendahara}</p>
          <p>NIP. {schoolData.nipBendahara}</p>
        </div>
      </div>
    </div>
  );

  if (jenisDokumen === 'PAKET_LENGKAP') {
    return (
      <div className="space-y-8">
        {renderKwitansi()}
        {renderNotaPesanan()}
        {renderFakturBarang()}
        {renderBAPenerimaan()}
        {renderLampiranBAPenerimaan()}
        {renderBAPemeriksaan()}
        {renderBAST()}
        {renderLampiranBAST()}
        {renderDokumentasi()}
      </div>
    );
  }

  if (jenisDokumen === 'baPenerimaan_full' || jenisDokumen === 'baPemeriksaan_full') {
    return (
      <div className="space-y-8">
        {renderBAPenerimaan()}
        {renderLampiranBAPenerimaan()}
      </div>
    );
  }

  if (jenisDokumen === 'bast_full') {
    return (
      <div className="space-y-8">
        {renderBAST()}
        {renderLampiranBAST()}
      </div>
    );
  }

  switch (jenisDokumen) {
    case 'kwitansi': return renderKwitansi();
    case 'notaPesanan': return renderNotaPesanan();
    case 'faktur': return renderFakturBarang();
    case 'baPenerimaan': return renderBAPenerimaan();
    case 'lampiranPenerimaan': return renderLampiranBAPenerimaan();
    case 'baPemeriksaan': return renderBAPemeriksaan();
    case 'bast': return renderBAST();
    case 'lampiranBAST': return renderLampiranBAST();
    case 'dokumentasi': return renderDokumentasi();
    default: return renderKwitansi();
  }
};

    setAuditLogs(prev => [{ waktu: waktuStr, user: `${currentUserRole} (${DEVELOPER_NAME})`, aksi }, ...prev]);
  };

  // ==========================================
  // 1. MUAT DATA TERSIMPAN SAAT APLIKASI DIBUKA / REFRESH
  // ==========================================
  useEffect(() => {
    let isMounted = true;
    const initLocalData = async () => {
      const savedData = await loadStateFromBrowserDB();
      if (savedData && isMounted) {
        if (savedData.schoolData) setSchoolData(savedData.schoolData);
        setFormatNomor(INITIAL_FORMAT_NOMOR);
        if (savedData.anggaran) setAnggaran(savedData.anggaran);
        if (savedData.transactions && savedData.transactions.length > 0) {
          const normalizedTrx = savedData.transactions.map(t => normalizeTransactionNumbers(t));
          setTransactions(normalizedTrx);
          setSelectedTrxId(normalizedTrx[0].id);
        }
        // Gabungkan dan perbarui daftar toko lokal dengan data master terbaru agar data baru selalu masuk
        if (savedData.tokoList && savedData.tokoList.length > 0) {
          const mergedToko = [...INITIAL_TOKO_LIST];
          savedData.tokoList.forEach((st) => {
            if (!mergedToko.some((t) => t.namaPenyedia?.trim().toLowerCase() === st.namaPenyedia?.trim().toLowerCase())) {
              mergedToko.push(st);
            }
          });
          setTokoList(mergedToko);
        } else {
          setTokoList(INITIAL_TOKO_LIST);
        }
        if (savedData.auditLogs) setAuditLogs(savedData.auditLogs);
        setSaveStatus('Data Lokal Aktif & Tersimpan');
        setLastSavedTime(savedData.updatedAt || 'Baru saja');
      } else if (isMounted) {
        setSaveStatus('Data Lokal Siap');
        setLastSavedTime('Data Default');
      }
      if (isMounted) setIsDataLoaded(true);
    };
    initLocalData();

    // Integrasi Cloud Sync (jika tersedia di environment)
    const initCloudSync = async () => {
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          const firebaseConfig = JSON.parse(__firebase_config);
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getFirestore(app);
          dbFirestoreRef.current = db;

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, (user) => {
            if (user && isMounted) {
              setFirebaseUser(user);
            }
          });
        }
      } catch (err) {
        // Berjalan mandiri dengan Database Lokal Browser (IndexedDB) jika offline
      }
    };
    initCloudSync();

    return () => { isMounted = false; };
  }, []);

  // Listener Cloud Firestore jika berjalan di environment cloud
  useEffect(() => {
    if (!firebaseUser || !dbFirestoreRef.current) return;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'smkn4-sinjai-bosp';
    const docRef = doc(dbFirestoreRef.current, 'artifacts', appId, 'users', firebaseUser.uid, 'bosp_data', 'main_state');

    const unsubscribe = onSnapshot(docRef, (snapshot) => {
      if (snapshot.exists()) {
        const cloudData = snapshot.data();
        if (cloudData && cloudData.payload) {
          try {
            const parsed = JSON.parse(cloudData.payload);
            isRemoteUpdateRef.current = true;
            if (parsed.schoolData) setSchoolData(parsed.schoolData);
            if (parsed.formatNomor) setFormatNomor(parsed.formatNomor);
            if (parsed.anggaran) setAnggaran(parsed.anggaran);
            if (parsed.transactions && parsed.transactions.length > 0) setTransactions(parsed.transactions);
            if (parsed.tokoList) setTokoList(parsed.tokoList);
            if (parsed.auditLogs) setAuditLogs(parsed.auditLogs);
            setLastSavedTime(parsed.updatedAt || 'Tersinkron');
            setTimeout(() => { isRemoteUpdateRef.current = false; }, 300);
          } catch (e) {}
        }
      }
    }, () => {});

    return () => unsubscribe();
  }, [firebaseUser]);

      transactions,
      tokoList,
      auditLogs,
      developer: DEVELOPER_NAME,
      updatedAt: jamStr
    };

    saveStateToBrowserDB(dataToSave).then((ok) => {
      if (ok) {
        setSaveStatus('Tersimpan Otomatis di Browser');
        setLastSavedTime(jamStr);
      }
    });

    // Simpan ke Cloud jika aktif dan bukan dari update remote
    if (firebaseUser && dbFirestoreRef.current && !isRemoteUpdateRef.current) {

      const docRef = doc(dbFirestoreRef.current, 'artifacts', appId, 'users', firebaseUser.uid, 'bosp_data', 'main_state');

    transactions.forEach(t => {
      const sub = t.items.reduce((acc, i) => acc + (i.jumlah * i.harga), 0) - (t.diskon || 0) + (t.pajakPPN || 0);
      totalRealisasi += sub;
      const statusVals = Object.values(t.statusDokumen || {});
      if (statusVals.includes('Belum') || !t.persetujuanKepsek) {
        dokBelumLengkapCount += 1;
      }
    });

    const persenRealisasi = anggaran.paguTahunan > 0 ? ((totalRealisasi / anggaran.paguTahunan) * 100).toFixed(1) : 0;

                      });
                    }}
                    className="w-full border border-slate-300 rounded-lg p-2 bg-white font-bold text-sky-900"
                  >
                    <option value="">-- Pilih Nama Pegawai / PJ Kegiatan --</option>
                    {DAFTAR_PEGAWAI_PJ.map((peg, idx) => (
                      <option key={idx} value={peg.nama}>{peg.nama} {peg.nip ? `(${peg.nip})` : ''}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="font-bold block mb-1">Pangkat / Golongan PJ Kegiatan</label>
                  <input value={editingTrx.pangkatPJKegiatan || ''} onChange={(e) => setEditingTrx({ ...editingTrx, pangkatPJKegiatan: e.target.value })} placeholder="Contoh: III/c" className="w-full border border-slate-300 rounded-lg p-2 bg-white" />
                </div>
                <div>
                  <label className="font-bold block mb-1">NIP PJ Kegiatan (Terisi Otomatis)</label>
                  <input value={editingTrx.nipPJKegiatan || ''} onChange={(e) => setEditingTrx({ ...editingTrx, nipPJKegiatan: e.target.value })} placeholder="Nomor NIP..." className="w-full border border-slate-300 rounded-lg p-2 bg-white font-mono" />
                </div>

                <div className="md:col-span-3 border-t border-slate-200 pt-3 mt-1">
                  <p className="font-extrabold text-slate-800 mb-2">Preview Otomatis Format Nomor Masing-Masing Dokumen (Default Bagian Belakang):</p>
                </div>
                <div>
                  <label className="font-bold block mb-1 text-sky-800">1. Nomor Kwitansi (KWT)</label>
                  <input readOnly value={editingTrx.noKwitansi} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-indigo-800">2. Nomor Nota Pesanan (NP)</label>
                  <input readOnly value={editingTrx.noNotaPesanan} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-amber-800">3. Nomor BA Pemeriksaan (BAP)</label>
                  <input readOnly value={editingTrx.noBAPenerimaan} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-emerald-800">4. Nomor BA Serah Terima Barang (BAST)</label>
                  <input readOnly value={editingTrx.noBAST} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-purple-800">5. Nomor BA Pendistribusian (DSB)</label>
                  <input readOnly value={editingTrx.noBAPemeriksaan} className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] font-bold text-slate-800" />
                </div>
                <div>
                  <label className="font-bold block mb-1 text-slate-500">6. Nomor Faktur (Dikosongkan)</label>
                  <input readOnly value={editingTrx.noFaktur} placeholder="(Kosong sesuai ketentuan)" className="w-full border border-slate-300 bg-slate-100 rounded-lg p-2 font-mono text-[11px] italic text-slate-500" />
                </div>
              </div>

              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="font-extrabold text-sm text-slate-800">Daftar Rincian Barang / Jasa</label>
                  <button
                    type="button"
                    onClick={() => setEditingTrx({
                      ...editingTrx,
                      items: [...editingTrx.items, { id: Date.now(), nama: '', jumlah: 1, satuan: 'Unit', harga: 0, kondisi: 'Baik & Baru', hasilPeriksa: 'Sesuai' }]
                    })}
                    className="bg-slate-900 text-white px-3 py-1.5 rounded-lg font-bold flex items-center gap-1"
                  >
                    <Plus className="w-3.5 h-3.5" /> Tambah Baris Barang
                  </button>
                </div>

                <table className="w-full border-collapse border border-slate-300 text-xs">
                  <thead className="bg-slate-100">
                    <tr>
                      <th className="border p-2">Nama Barang</th>
                      <th className="border p-2 w-16">Qty</th>
                      <th className="border p-2 w-20">Satuan</th>
                      <th className="border p-2 w-28">Harga Satuan</th>
                      <th className="border p-2 w-28">Checklist BAP</th>
                      <th className="border p-2 w-28 text-right">Subtotal</th>
                      <th className="border p-2 w-10"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {editingTrx.items.map((item, idx) => (
                      <tr key={item.id}>
                        <td className="border p-1.5">
                          <input required value={item.nama} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].nama = e.target.value;
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} placeholder="Nama barang..." className="w-full p-1 border rounded" />
                        </td>
                        <td className="border p-1.5">
                          <input type="number" min="1" value={item.jumlah} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].jumlah = Number(e.target.value);
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} className="w-full p-1 border rounded text-center" />
                        </td>
                        <td className="border p-1.5">
                          <input value={item.satuan} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].satuan = e.target.value;
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} className="w-full p-1 border rounded text-center" />
                        </td>
                        <td className="border p-1.5">
                          <input type="number" min="0" value={item.harga} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].harga = Number(e.target.value);
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} className="w-full p-1 border rounded text-right" />
                        </td>
                        <td className="border p-1.5">
                          <select value={item.hasilPeriksa} onChange={(e) => {
                            const newItems = [...editingTrx.items];
                            newItems[idx].hasilPeriksa = e.target.value;
                            setEditingTrx({ ...editingTrx, items: newItems });
                          }} className="w-full p-1 border rounded">
                            <option>Sesuai</option>
                            <option>Tidak Sesuai</option>
                            <option>Perlu Perbaikan</option>
                          </select>
                        </td>
                        <td className="border p-1.5 text-right font-bold">
                          {formatRupiah(item.jumlah * item.harga)}
                        </td>
                        <td className="border p-1.5 text-center">
                          {editingTrx.items.length > 1 && (
                            <button type="button" onClick={() => setEditingTrx({ ...editingTrx, items: editingTrx.items.filter((_, i) => i !== idx) })} className="text-red-600">
                              <Trash2 className="w-4 h-4" />
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="flex items-center justify-between pt-4 border-t border-slate-200">
                <div>
                  <span className="text-slate-500">Total Pembayaran Otomatis: </span>
                  <span className="text-lg font-extrabold text-emerald-700">
                    {formatRupiah(editingTrx.items.reduce((s, i) => s + (i.jumlah * i.harga), 0))}
                  </span>
                </div>
                <div className="flex gap-3">
                  <button type="button" onClick={() => setShowTrxModal(false)} className="px-4 py-2.5 rounded-xl border border-slate-300 font-bold">
                    Batal
                  </button>
                  <button type="submit" className="bg-sky-600 hover:bg-sky-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-md">
                    Simpan Transaksi & Generate Seluruh Dokumen SPJ
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ========================================== */}
      {/* MODAL POPUP TAMBAH TOKO / REKANAN BARU */}
      {/* ========================================== */}
      {showModalTambahToko && (
        <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 print:hidden">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 text-xs space-y-4">
            <div className="flex items-center justify-between border-b pb-3">
              <h3 className="font-extrabold text-sm text-slate-900 flex items-center gap-2">
                <Building2 className="w-5 h-5 text-emerald-600" />
                <span>Tambah Toko / Rekanan Baru</span>
              </h3>
              <button onClick={() => setShowModalTambahToko(false)} className="p-1 rounded-lg hover:bg-slate-100">
                <X className="w-4 h-4" />
              </button>
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                if (!newTokoForm.namaPenyedia) {
                  showToast('Nama Toko wajib diisi!', 'error');
                  return;
                }
                setTokoList(prev => [...prev, newTokoForm]);
                setEditingTrx({
                  ...editingTrx,
                  namaPenyedia: newTokoForm.namaPenyedia,
                  namaPemilikPenyedia: newTokoForm.namaPemilikPenyedia,
                  alamatPenyedia: newTokoForm.alamatPenyedia,
                  teleponPenyedia: newTokoForm.teleponPenyedia,
                  npwpPenyedia: newTokoForm.npwpPenyedia || ''
                });
                setShowModalTambahToko(false);
                setNewTokoForm({ namaPenyedia: '', alamatPenyedia: '', namaPemilikPenyedia: '', teleponPenyedia: '', npwpPenyedia: '' });
                showToast(`Toko "${newTokoForm.namaPenyedia}" berhasil ditambahkan & tersimpan di daftar toko!`);
              }}
              className="space-y-3"
            >
              <div>
                <label className="font-bold block mb-1">Nama Toko / Perusahaan</label>
                <input
                  required
                  value={newTokoForm.namaPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, namaPenyedia: e.target.value })}
                  placeholder="Contoh: TOKO BERKAH JAYA"
                  className="w-full border border-slate-300 rounded-lg p-2 font-bold"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">Alamat Toko</label>
                <input
                  value={newTokoForm.alamatPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, alamatPenyedia: e.target.value })}
                  placeholder="Contoh: Jl. Poros Sinjai..."
                  className="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">Nama Pemilik / Penanda Tangan</label>
                <input
                  value={newTokoForm.namaPemilikPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, namaPemilikPenyedia: e.target.value })}
                  placeholder="Contoh: Budi Santoso"
                  className="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">Nomor HP / Kontak</label>
                <input
                  value={newTokoForm.teleponPenyedia}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, teleponPenyedia: e.target.value })}
                  placeholder="Contoh: 081234567890"
                  className="w-full border border-slate-300 rounded-lg p-2"
                />
              </div>
              <div>
                <label className="font-bold block mb-1">NPWP Toko / Penyedia</label>
                <input
                  value={newTokoForm.npwpPenyedia || ''}
                  onChange={(e) => setNewTokoForm({ ...newTokoForm, npwpPenyedia: e.target.value })}
                  placeholder="Contoh: 730705839162047"
                  className="w-full border border-slate-300 rounded-lg p-2 font-mono"
                />
              </div>

              <div className="pt-2 flex justify-end gap-2">
                <button
                  type="button"
                  onClick={() => setShowModalTambahToko(false)}
                  className="px-4 py-2 rounded-lg bg-slate-200 hover:bg-slate-300 font-bold text-slate-700"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 font-bold text-white shadow-sm"
                >
                  Simpan & Pilih Toko
                </button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const rootElement = document.getElementById('root');
const root = createRoot(rootElement);
root.render(<App />);

    </script>
</body>
</html>
